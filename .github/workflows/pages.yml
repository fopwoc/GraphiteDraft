name: Deploy documentation to GitHub Pages

on:
  push:
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Prepare README as the home page
        run: |
          mkdir -p .graphite-pages
          cp README.md .graphite-pages/index.md
      - name: Render README with Graphite Draft
        uses: ./
        with:
          source: .graphite-pages
          output: dist
      - name: Render example site with Graphite Draft
        uses: ./
        with:
          source: examples/content
          output: dist/example
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: github-pages
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
