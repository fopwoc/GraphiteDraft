name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - COPYRIGHT
      - LICENSE
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"
      - COPYRIGHT
      - LICENSE

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Resolve development build identity
        run: node tools/resolve-version.mjs --write-package
      - run: bun install --frozen-lockfile
      - run: bun run test
      - name: Test Pages documentation
        run: |
          mkdir -p .graphite-pages
          cp README.md AI_USAGE.md .graphite-pages/
          bun packages/graphite-draft/bin/graphite-draft.mjs \
            build .graphite-pages "$RUNNER_TEMP/graphite-pages"
      - name: Pack npm artifact
        run: |
          mkdir -p artifacts
          npm pack --workspace packages/graphite-draft --pack-destination artifacts
      - uses: actions/upload-artifact@v6
        with:
          name: npm-package
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 3
